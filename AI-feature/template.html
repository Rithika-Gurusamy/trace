<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Assessment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 700px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .upload-area {
            border: 2px dashed #aaa;
            border-radius: 10px;
            padding: 50px 20px;
            background: #fafafa;
        }

        .upload-area input {
            margin-top: 20px;
        }

        .upload-button {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Upload Your Resume</h1>

        <p>
            Upload your resume to analyze your profile and get an assessment.
        </p>

        <div class="upload-area">
            <h3>Select your resume</h3>
            <p>PDF, DOC, or DOCX</p>

            <input type="file" accept=".pdf,.doc,.docx">

            <br>

            <button class="upload-button">
                Upload Resume
            </button>
        </div>

    </div>

</body>

</html>
